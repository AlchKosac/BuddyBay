<!doctype html>
<html lang="en" data-skin="brass-radio">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuddyBay</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="skins/brass-radio.css" />
  <link rel="stylesheet" href="skins/glass-dock.css" />
  <link rel="stylesheet" href="skins/terminal-pet.css" />
  <link rel="stylesheet" href="skins/windows.css" />
</head>
<body>
  <div id="island" class="island">
    <div id="grip" class="grip" data-i18n-title="grip.title" data-i18n-aria="grip.aria"></div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="bar">
      <div id="buddies" class="buddies" data-i18n-aria="buddies.aria"></div>
      <form id="prompt" class="prompt" autocomplete="off">
        <input id="prompt-input" type="text" data-i18n-placeholder="prompt.placeholder" />
      </form>
      <button id="settings-btn" class="icon-btn" type="button" data-i18n-aria="settings.open" data-i18n-title="settings.open">⚙</button>
    </div>
    <div id="settings" class="settings" hidden></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
