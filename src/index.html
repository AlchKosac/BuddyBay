<!doctype html>
<html lang="cs" data-skin="brass-radio">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuddyBay</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="skins/brass-radio.css" />
  <link rel="stylesheet" href="skins/glass-dock.css" />
  <link rel="stylesheet" href="skins/terminal-pet.css" />
</head>
<body>
  <div id="island" class="island">
    <div class="bubble" id="bubble" hidden></div>
    <div class="bar">
      <div id="buddies" class="buddies" aria-label="Aktivní buddy"></div>
      <form id="prompt" class="prompt" autocomplete="off">
        <input id="prompt-input" type="text" placeholder="Zadej úkol pro vybraného buddy…" />
      </form>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Nastavení" title="Nastavení">⚙</button>
    </div>
    <div id="settings" class="settings" hidden></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
